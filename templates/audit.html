<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audit log</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
<body>
  <header>
    <h1>Financial Risk Review Dashboard</h1>
    <nav>
      <a href="/ui">Dashboard</a>
      <a href="/ui/alerts">Alerts</a>
      <a href="/ui/transactions">Transactions</a>
      <a href="/ui/check">Check transaction</a>
      <a href="/ui/rules">Rules</a>
      <a href="/ui/audit">Audit log</a>
    </nav>
  </header>
  <main>
    <h2>Audit log</h2>
    <p class="note">Every change to a transaction or alert, newest first.</p>
    <table id="auditTable">
      <thead>
        <tr><th>Time</th><th>User</th><th>Action</th><th>Entity</th><th>ID</th><th>Details</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>

  <script>
    function esc(v) {
      const d = document.createElement("div");
      d.textContent = v;
      return d.innerHTML;
    }

    async function load() {
      const res = await fetch("/audit-log?limit=100");
      const rows = await res.json();
      document.querySelector("#auditTable tbody").innerHTML = rows.map(r => `
        <tr>
          <td>${esc(r.created_at.replace("T", " "))}</td>
          <td>${esc(r.user_name)}</td>
          <td>${esc(r.action)}</td>
          <td>${esc(r.entity)}</td>
          <td>${esc(r.entity_id)}</td>
          <td>${esc(r.details)}</td>
        </tr>`).join("");
    }
    load();
  </script>
</body>
</html>
