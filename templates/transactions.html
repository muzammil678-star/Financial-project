<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transactions</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
<body>
  <header>
    <h1>Financial Risk Review Dashboard</h1>
    <nav>
      <a href="/ui">Dashboard</a>
      <a href="/ui/alerts">Alerts</a>
      <a href="/ui/transactions">Transactions</a>
      <a href="/ui/check">Check transaction</a>
      <a href="/ui/rules">Rules</a>
      <a href="/ui/audit">Audit log</a>
    </nav>
  </header>
  <main>
    <div class="panel filters">
      <label>Account ID <input type="number" id="account" min="1"></label>
      <label>Region
        <select id="region">
          <option value="">All</option>
          <option>North</option><option>South</option><option>East</option>
          <option>West</option><option>Central</option><option>Overseas</option>
        </select>
      </label>
      <button id="searchBtn">Search</button>
    </div>

    <table id="txTable">
      <thead>
        <tr>
          <th>ID</th><th>Account</th><th>Time</th><th>Amount</th>
          <th>Type</th><th>Channel</th><th>Region</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>

  <script>
    function esc(v) {
      const d = document.createElement("div");
      d.textContent = v;
      return d.innerHTML;
    }

    async function load() {
      const acc = document.getElementById("account").value;
      const region = document.getElementById("region").value;
      let url = "/transactions?limit=100";
      if (acc) url += "&account_id=" + encodeURIComponent(acc);
      if (region) url += "&region=" + encodeURIComponent(region);
      const res = await fetch(url);
      const rows = await res.json();
      document.querySelector("#txTable tbody").innerHTML = rows.map(t => `
        <tr>
          <td>${t.transaction_id}</td>
          <td>${t.account_id}</td>
          <td>${esc(t.transaction_datetime.replace("T", " "))}</td>
          <td>${t.amount.toFixed(2)}</td>
          <td>${esc(t.transaction_type)}</td>
          <td>${esc(t.channel)}</td>
          <td>${esc(t.region)}</td>
        </tr>`).join("");
    }

    document.getElementById("searchBtn").addEventListener("click", load);
    load();
  </script>
</body>
</html>
