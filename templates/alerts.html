<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alerts</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
<body>
  <header>
    <h1>Financial Risk Review Dashboard</h1>
        {% include "_nav.html" %}
  </header>
  <main>
    <label>Status:
      <select id="statusFilter">
        <option value="">All</option>
        <option>PENDING</option>
        <option>UNDER_REVIEW</option>
        <option>CLEARED</option>
        <option>ESCALATED</option>
      </select>
    </label>
        <a class="button" href="/export/alerts.csv">Export CSV</a>
    <table id="alertsTable">
      <thead>
        <tr>
          <th>ID</th><th>Account</th><th>Time</th><th>Amount</th><th>Region</th>
          <th>Score</th><th>Rules</th><th>Reason</th><th>Status</th><th>Change</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>



    <div id="modal" class="modal hidden">
    <div class="modal-box">
      <button class="close" id="closeModal">&times;</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script>
    const STATUSES = ["PENDING", "UNDER_REVIEW", "CLEARED", "ESCALATED"];

    function esc(v) {
      const d = document.createElement("div");
      d.textContent = v;
      return d.innerHTML;
    }
       async function openDetail(id) {
      const [alertRes, histRes] = await Promise.all([
        fetch("/alerts/" + id), fetch("/alerts/" + id + "/history")
      ]);
      const a = await alertRes.json();
      const hist = await histRes.json();
      const level = a.risk_score >= 65 ? "HIGH" : "MEDIUM";
      document.getElementById("modalBody").innerHTML = `
        <h2>Alert ${a.alert_id} <span class="badge ${level}">${level}</span></h2>
        <p><span class="chip ${esc(a.review_status)}">${esc(a.review_status.replace("_", " "))}</span>
           Risk score <b>${a.risk_score}</b></p>
        <dl>
          <dt>Transaction</dt><dd>${a.transaction_id} (account ${a.account_id})</dd>
          <dt>Time</dt><dd>${esc(a.transaction_datetime.replace("T", " "))}</dd>
          <dt>Amount</dt><dd>${a.amount.toFixed(2)}</dd>
          <dt>Region</dt><dd>${esc(a.region)}</dd>
          <dt>Rules</dt><dd>${esc(a.rule_name)}</dd>
          <dt>Reason</dt><dd>${esc(a.reason)}</dd>
          <dt>Created</dt><dd>${esc(a.created_at.replace("T", " "))}</dd>
        </dl>
        <h3>Review history</h3>
        ${hist.length
          ? `<ul class="history">${hist.map(h =>
              `<li><b>${esc(h.created_at.replace("T", " "))}</b> ${esc(h.user_name)}: ${esc(h.action)} ${esc(h.details)}</li>`
            ).join("")}</ul>`
          : "<p class='note'>No changes recorded yet.</p>"}`;
      document.getElementById("modal").classList.remove("hidden");
    }

    document.querySelector("#alertsTable tbody").addEventListener("click", (e) => {
      if (e.target.tagName === "SELECT" || e.target.tagName === "OPTION") return;
      const tr = e.target.closest("tr");
      if (tr && tr.dataset.id) openDetail(tr.dataset.id);
    });

    document.getElementById("closeModal").addEventListener("click", () => {
      document.getElementById("modal").classList.add("hidden");
    });
    document.getElementById("modal").addEventListener("click", (e) => {
      if (e.target.id === "modal") e.target.classList.add("hidden");
    });
    async function loadAlerts() {
      const status = document.getElementById("statusFilter").value;
      const url = "/alerts?limit=50" + (status ? "&status=" + status : "");
      const res = await fetch(url);
      const alerts = await res.json();
      const body = document.querySelector("#alertsTable tbody");
      body.innerHTML = "";
      alerts.forEach(a => {
        const options = STATUSES.map(s =>
          `<option ${s === a.review_status ? "selected" : ""}>${s}</option>`).join("");
        const tr = document.createElement("tr");
                if (a.risk_score >= 65) tr.className = "high-row";
                        tr.dataset.id = a.alert_id;
        tr.innerHTML = `
          <td>${a.alert_id}</td>
          <td>${a.account_id}</td>
          <td>${esc(a.transaction_datetime.replace("T", " "))}</td>
          <td>${a.amount.toFixed(2)}</td>
          <td>${esc(a.region)}</td>
                  <td><span class="badge ${a.risk_score >= 65 ? "HIGH" : "MEDIUM"}">${a.risk_score}</span></td>
          <td>${esc(a.rule_name)}</td>
          <td>${esc(a.reason)}</td>
          <td><span class="chip ${esc(a.review_status)}">${esc(a.review_status.replace("_", " "))}</span></td>
          <td><select data-id="${a.alert_id}">${options}</select></td>`;
        body.appendChild(tr);
      });
    }

    document.querySelector("#alertsTable tbody").addEventListener("change", async (e) => {
      if (e.target.tagName !== "SELECT") return;
      const res = await fetch("/alerts/" + e.target.dataset.id, {
        method: "PATCH",
        headers: {"Content-Type": "application/json", "X-User": "reviewer"},
        body: JSON.stringify({review_status: e.target.value})
      });
      if (res.ok) { showToast("Status updated"); loadAlerts(); } else { showToast("Update failed", "error"); }
    });

    document.getElementById("statusFilter").addEventListener("change", loadAlerts);
    loadAlerts();
  </script>
</body>
</html>
